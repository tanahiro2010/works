<h2 id="%E5%A5%BD%E3%81%8D%E3%81%AA-span-classred%E3%83%95%E3%83%AC%E3%83%BC%E3%83%A0%E3%83%AF%E3%83%BC%E3%82%AFspan-%E3%81%82%E3%82%8A%E3%81%BE%E3%81%99%E3%81%8B">好きな <span class="red">フレームワーク</span> ありますか？</h2>
<ul>
<li><strong>Hono</strong>: 今日の主役</li>
<li><strong>React</strong>: UIを作るときの選択肢</li>
<li><strong>Ruby on Rails</strong>: 育てながら作れる一体型</li>
</ul>
<div class="big-statement favorite-message">でも技術選定には<br /><em>何度も失敗</em>しました</div>
<ul>
<li>好きな技術と、必要な技術は同じとは限らない</li>
<li>「あとで使うかも」を先に実装してしまう</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" lang="en-US" data-marpit-pagination="8" style="--paginate:true;" data-marpit-pagination-total="46" data-size="16:9">
<h2 id="%E3%82%A2%E3%83%B3%E3%82%B1%E3%83%BC%E3%83%88%E3%81%AE%E7%B5%90%E6%9E%9C-%E5%80%8B%E4%BA%BA%E9%96%8B%E7%99%BA%E3%81%A7%E3%81%AF">アンケートの結果 個人開発では...</h2>
<ul>
<li><strong>Next.js</strong>: 大きなReactエコシステム</li>
<li><strong>Nuxt</strong>: Vueのフルスタック体験</li>
<li><strong>TanStack Start</strong>: 型付きルートとServer Functions</li>
<li><strong>React SPA</strong>: 自由なクライアント構成</li>
<li><strong>Rails</strong>: 成熟した一体型の開発体験</li>
<li><strong>Hono</strong>: Web標準に近い小さな入口</li>
</ul>
<blockquote>
<p>選択肢の多さではなく、必要な複雑さの量で選ぶ</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-class="lead" lang="en-US" class="lead" data-marpit-pagination="9" style="--paginate:true;--class:lead;" data-marpit-pagination-total="46" data-size="16:9"><div class="geo ring chapter-ring"></div>
<h1 id="%E5%80%8B%E4%BA%BA%E9%96%8B%E7%99%BA%E3%81%AE%E6%95%B5%E3%81%AFstrong%E8%A4%87%E9%9B%91%E3%81%95strong">個人開発の敵は<strong>複雑さ</strong></h1>
<ul>
<li>境界が増える</li>
<li>状態を同期する</li>
<li>実行場所(デプロイ先)を考える</li>
<li><strong>お金</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" lang="en-US" data-marpit-pagination="10" style="--paginate:true;" data-marpit-pagination-total="46" data-size="16:9">
<h1 id="%E3%81%82%E3%81%A8%E3%81%A7%E5%BF%85%E8%A6%81%E3%81%8B%E3%82%82">「あとで必要かも」</h1>
<h2 id="%E6%9C%80%E5%88%9D%E3%81%8B%E3%82%89%E8%83%8C%E8%B2%A0%E3%81%A3%E3%81%A6%E3%81%84%E3%81%BE%E3%81%9B%E3%82%93%E3%81%8B">最初から背負っていませんか？</h2>
<div class="type-ghost stats-word">増やす前に考える</div>
<ul>
<li><strong>境界</strong>: フロントエンドとAPIを分ける</li>
<li><strong>同期</strong>: 状態とデータ取得を揃える</li>
<li><strong>実行</strong>: hydrationとブラウザJSを管理する</li>
<li><strong>性能</strong>: キャッシュ戦略を考える</li>
<li><strong>配備</strong>: 複数のデプロイ先を扱う</li>
<li><strong>運用</strong>: 増えていく手数を引き受ける</li>
</ul>
<blockquote>
<p>便利な仕組みを必要になる前から持っていないか</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" lang="en-US" data-marpit-pagination="11" style="--paginate:true;" data-marpit-pagination-total="46" data-size="16:9">
<h2 id="%E5%B0%8F%E8%AA%AC%E6%8A%95%E7%A8%BF%E3%82%B5%E3%82%A4%E3%83%88%E3%82%92%E6%B2%A1%E3%81%AB%E3%81%97%E3%81%BE%E3%81%97%E3%81%9F">小説投稿サイトを没にしました</h2>
<div class="flow failure-flow">
  <div class="flow-step"><b>01 / FETCH</b><span>ブラウザから<br />大量のAPIを呼ぶ</span></div>
  <div class="flow-arrow">→</div>
  <div class="flow-step"><b>02 / WAIT</b><span>アプリとDBの<br />配置場所も未整理</span></div>
  <div class="flow-arrow">→</div>
  <div class="flow-step"><b>03 / DROP</b><span>待ち時間を改善できず<br />開発を中止</span></div>
</div>
<div class="failure-transition">当時の構成を見てみます。</div>
<ul>
<li>ブラウザで取得してから画面を組み立てる</li>
<li>API・アプリ・DBの距離をあとから考える</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" lang="en-US" data-marpit-pagination="12" style="--paginate:true;" data-marpit-pagination-total="46" data-size="16:9">
<h2 id="%E5%BD%93%E6%99%82%E3%81%AFnextjs--vercel--neon">当時はNext.js + Vercel + Neon</h2>
<div class="layers failure-stack">
  <div class="layer"><b>Next.js</b><span>画面とAPI Routesを実装</span></div>
  <div class="layer"><b>Vercel</b><span>Next.jsアプリの公開先</span></div>
  <div class="layer"><b>Neon</b><span>データを保存するPostgreSQL</span></div>
</div>
<div class="failure-request"><span>ブラウザ</span><span class="flow-arrow">→</span><span>Vercel上のAPI</span><span class="flow-arrow">→</span><span>NeonのDB</span></div>
<div class="failure-context">useEffectでデータを取得し、ブラウザで画面を組み立てる。<br />アプリとDBのリージョン（配置地域）も未整理でした。</div>
<div class="failure-takeaway">Next.jsが悪いという話ではありません。<br />当時の自分の実装と構成の問題です。</div>
<div class="note">非同期処理とリージョンを十分に設計せず、原因を測る前に複雑さだけ増やしていました。</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-class="lead" lang="en-US" class="lead" data-marpit-pagination="13" style="--paginate:true;--class:lead;" data-marpit-pagination-total="46" data-size="16:9"><div class="geo solid-square closing-square"></div>
<h1 id="%E5%88%9D%E6%9C%9F%E8%A1%A8%E7%A4%BAbrstrong%E6%9C%80%E6%82%AA%E3%81%A7%E7%B4%841%E5%88%86strong">初期表示<br /><strong>最悪で約1分。</strong></h1>
<h3 id="%E8%A8%80%E3%81%84%E9%81%8E%E3%81%8E%E3%81%8B%E3%82%82%E3%81%97%E3%82%8C%E3%81%AA%E3%81%84%E3%81%91%E3%81%A9%E5%B0%91%E3%81%AA%E3%81%8F%E3%81%A8%E3%82%8230%E7%A7%92%E4%BB%A5%E4%B8%8A%E3%81%AF%E3%81%97%E3%81%9F">言い過ぎかもしれないけど少なくとも30秒以上はした</h3>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" lang="en-US" data-marpit-pagination="14" style="--paginate:true;" data-marpit-pagination-total="46" data-size="16:9">
<h2 id="%E3%81%9F%E3%81%A0%E3%81%AE%E5%8D%98%E4%BD%8D%E8%A8%88%E7%AE%97%E6%A9%9F%E3%81%AA%E3%81%AE%E3%81%AB">ただの単位計算機なのに</h2>
<div class="big-statement">技術スタックは、<br /><em>Next.js</em></div>
<div class="flow">
  <div class="flow-step"><b>計算する</b><span>ブラウザで十分</span></div>
  <div class="flow-arrow">→</div>
  <div class="flow-step"><b>送る</b><span>値をバックエンドへ</span></div>
  <div class="flow-arrow">→</div>
  <div class="flow-step"><b>待つ</b><span>ロードが重い</span></div>
  <div class="flow-step"><b>収益</b><span>どこぞのAdsence</span></div>
</div>
<ul>
<li>計算はブラウザで完結できる</li>
<li>毎回APIへ送る理由がない</li>
<li>待ち時間だけが増えていく</li>
</ul>
<div class="note">広告収益化まで考えると、無料プランの利用条件も気になります。</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" lang="en-US" data-marpit-pagination="15" style="--paginate:true;" data-marpit-pagination-total="46" data-size="16:9">

<h2 id="%E3%81%9D%E3%81%93%E3%81%A7renovel%E3%82%92%E4%BD%9C%E3%82%8A%E7%9B%B4%E3%81%97%E3%81%BE%E3%81%97%E3%81%9F">そこでReNovelを作り直しました</h2>

<h2 id="%E3%81%93%E3%81%AE%E8%A6%8B%E3%81%9F%E7%9B%AE%E3%81%AFhono%E3%81%A7%E5%8B%95%E3%81%84%E3%81%A6%E3%81%84%E3%81%BE%E3%81%99">この見た目はHonoで動いています</h2>

<h2 id="%E6%A7%8B%E6%88%90%E3%81%AF%E3%81%BE%E3%81%9A%E3%81%93%E3%82%8C%E3%81%A0%E3%81%91">構成はまずこれだけ</h2>

</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-class="section" lang="en-US" class="section" style="--class:section;" data-size="16:9"><div class="chapter-label">Chapter 02 / 必要になってから複雑にしよう</div>
<div class="chapter-number">02</div>
<div class="geo ring chapter-ring"></div>
<h1 id="%E8%A4%87%E9%9B%91%E3%81%95%E3%81%AFbr%E3%81%82%E3%81%A8%E3%81%A7%E6%89%95%E3%81%8A%E3%81%86%E3%83%8D%F0%9F%98%98">複雑さは<br />あとで払おうネ<img class="emoji" draggable="false" alt="😘" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f618.svg" data-marp-twemoji=""/></h1>
<p>最初からAPIとかゴリゴリに設計しなくても、<br />
個人開発だからこそまずは〝単純〟に始めれる</p>
<ul>
<li>まずHTMLを返す</li>
<li>必要になったらフォームを強化する</li>
<li>さらに必要なら、その部分だけJSを足す</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" lang="en-US" data-marpit-pagination="21" style="--paginate:true;" data-marpit-pagination-total="46" data-size="16:9">
<h2 id="%E3%81%BE%E3%81%9A%E3%81%AFhtml%E3%82%92%E8%BF%94%E3%81%9B%E3%81%B0%E3%81%84%E3%81%84">まずはHTMLを返せばいい</h2>
<div class="flow">
  <div class="flow-step"><b>GET /novel</b><span>URL + HTTP</span></div>
  <div class="flow-arrow">→</div>
  <div class="flow-step"><b>APPLICATION</b><span>Use case</span></div>
  <div class="flow-arrow">→</div>
  <div class="flow-step"><b>HONO JSX</b><span>HTML</span></div>
  <div class="flow-arrow">→</div>
  <div class="flow-step"><b>BROWSER</b><span>HTML</span></div>
</div>
<p><br /><br /></p>
<ul>
<li>初期表示はサーバーで完了(SSG)</li>
<li>ブラウザ側の仕事を増やさない</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-class="lead" lang="en-US" class="lead" data-marpit-pagination="22" style="--paginate:true;--class:lead;" data-marpit-pagination-total="46" data-size="16:9"><div class="geo ring chapter-ring"></div>
<div class="big-statement">初期表示のために<br /><em>APIを作りすぎない</em></div>
<ul>
<li>SSGだからこそ、HTMLで返せるものはHTMLで返す</li>
<li>APIは、APIが必要なところに使う</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" lang="en-US" data-marpit-pagination="23" style="--paginate:true;" data-marpit-pagination-total="46" data-size="16:9">
<h2 id="honojsx%E3%81%A7html%E3%82%92%E8%BF%94%E3%81%99"><code>hono/jsx</code>でHTMLを返す</h2>
<div class="big-statement">JSXを書いて、<br /><em>サーバーでHTML</em>を作る</div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-tsx"><span class="hljs-comment">/** <span class="hljs-doctag">@jsxImportSource</span> hono/jsx */</span>
app.<span class="hljs-title function_">get</span>(<span class="hljs-string">&#x27;/novel&#x27;</span>, <span class="hljs-function">(<span class="hljs-params">c</span>) =&gt;</span> c.<span class="hljs-title function_">html</span>(
  <span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">NovelPage</span> <span class="hljs-attr">novel</span>=<span class="hljs-string">{novel}</span> /&gt;</span></span>
))
</code></pre>
<ul>
<li>JSXを書く</li>
<li>サーバーでHTMLを作る</li>
<li>ブラウザには完成したページを返す</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" lang="en-US" data-marpit-pagination="24" style="--paginate:true;" data-marpit-pagination-total="46" data-size="16:9">
<h2 id="%E4%B8%80%E3%81%A4%E3%81%AE%E3%82%A2%E3%83%97%E3%83%AA%E3%81%A7%E8%B2%AC%E5%8B%99%E3%81%AF%E6%B7%B7%E3%81%9C%E3%81%AA%E3%81%84">一つのアプリで責務は混ぜない</h2>
<div class="layers">
  <div class="layer"><b>画面</b><span>route / controller / JSX view</span></div>
  <div class="layer"><b>処理</b><span>use case / query / service</span></div>
  <div class="layer"><b>データ</b><span>Drizzle / PostgreSQL</span></div>
</div>
<div class="type-ghost stats-word">一つのアプリで育てる</div>
<ul>
<li>最初からサービスを分割しない</li>
<li>でも、画面・処理・データは混ぜない</li>
<li>必要になった境界だけ、あとから深くする</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" lang="en-US" data-marpit-pagination="25" style="--paginate:true;" data-marpit-pagination-total="46" data-size="16:9">
<h2 id="%E3%83%9A%E3%83%BC%E3%82%B8%E5%85%A8%E4%BD%93%E3%81%AFssr%E5%8B%95%E3%81%8F%E3%81%AE%E3%81%AF%E4%B8%80%E9%83%A8%E5%88%86">ページ全体はSSR。動くのは一部分</h2>
<ul>
<li>
<p><strong>SSR</strong>: ページ全体をHTMLで返す</p>
</li>
<li>
<p><strong>Forms</strong>: リンクとHTMLフォームで動かす</p>
</li>
<li>
<p><strong>Island</strong>: 操作する部分だけJSを足す</p>
</li>
<li>
<p>ページ全体: SSR</p>
</li>
<li>
<p>遷移や送信: HTML</p>
</li>
<li>
<p>局所的な操作: Island</p>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" lang="en-US" data-marpit-pagination="26" style="--paginate:true;" data-marpit-pagination-total="46" data-size="16:9">

<div class="big-statement">HTMLの海に浮かぶ、<br /><em>小さなインタラクション</em></div>
<div class="type-ghost stats-word">まずHTML / 必要なJS</div>
<ul>

<li>必要な場所だけブラウザで実行する</li>

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" lang="en-US" data-marpit-pagination="27" style="--paginate:true;" data-marpit-pagination-total="46" data-size="16:9">

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-tsx"><span class="hljs-comment">/** <span class="hljs-doctag">@jsxImportSource</span> hono/jsx/dom */</span>

<h2 id="%E5%8B%95%E3%81%8B%E3%81%97%E3%81%9F%E3%81%84%E3%81%A8%E3%81%93%E3%82%8D%E3%81%A0%E3%81%91js%E3%82%92%E8%B6%B3%E3%81%99">動かしたいところだけJSを足す</h2>
<div class="type-ghost stats-word">ReNovelで実際に使った場所</div>
<div class="big-statement">動かしたい場所だけ、<br /><em>island</em>にする</div>
<p>いいね　/　フォロー　/　評価　/　本棚追加　/　本棚削除</p>

<li>局所的な操作: JavaScript</li>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-class="small-code" lang="en-US" class="small-code" data-marpit-pagination="29" style="--paginate:true;--class:small-code;" data-marpit-pagination-total="46" data-size="16:9">
<h2 id="%E3%81%BE%E3%81%9A%E3%81%AFjavascript%E3%81%AA%E3%81%97%E3%81%A7%E5%8B%95%E3%81%8B%E3%81%99">まずはJavaScriptなしで動かす</h2>
<div class="vertical-type">No-JS fallback / Server HTML</div>
<ul>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-tsx"><span class="hljs-comment">/** <span class="hljs-doctag">@jsxImportSource</span> hono/jsx/dom */</span>

<span class="hljs-keyword">export</span> <span class="hljs-keyword">function</span> <span class="hljs-title function_">LikeButton</span>(<span class="hljs-params">{ action, liked: initial, count: initialCount }</span>) {

  }

}

<h2 id="seo%E3%81%AF%E6%9C%80%E5%88%9D%E3%81%AEhtml%E3%81%8B%E3%82%89%E5%A7%8B%E3%81%BE%E3%82%8B">SEOは最初のHTMLから始まる</h2>
<div class="big-statement">各URLの情報が、<em>最初のHTML</em>に入っているか</div>

</ul>

<h2 id="%E6%9C%80%E5%88%9D%E3%81%AEhtml%E3%81%AB%E4%BD%95%E3%82%92%E5%85%A5%E3%82%8C%E3%82%8B">最初のHTMLに何を入れる？</h2>
<ul>
<li><strong>Content</strong>: 本文 / title / description</li>
<li><strong>Identity</strong>: canonical / OGP</li>
<li><strong>Delivery</strong>: JS実行を待たずに返す</li>
</ul>
<p>ReactやNext.jsでもSSRで実現できます。Honoではページ全体のhydrationを前提にせず選べます</p>
<ul>
<li>フレームワーク名ではなく、返すHTMLを見る</li>
<li>各URLの情報を各URLで持つ</li>
<li>必要なJSだけを選ぶ</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" lang="en-US" data-marpit-pagination="35" style="--paginate:true;" data-marpit-pagination-total="46" data-size="16:9">
<h2 id="hono%E3%82%92%E5%B0%8F%E3%81%95%E3%81%8F%E5%85%AC%E9%96%8B%E3%81%99%E3%82%8B">Honoを小さく公開する</h2>
<div class="flow">
  <div class="flow-step"><b>APP</b><span>Hono appをexport</span></div>
  <div class="flow-arrow">→</div>
  <div class="flow-step"><b>WORKERS</b><span>エッジでリクエストを処理</span></div>
  <div class="flow-arrow">→</div>
  <div class="flow-step"><b>SHIP</b><span>`wrangler deploy`</span></div>
</div>
<div class="big-statement">まずはアプリを<br /><em>小さく公開する</em></div>
<ul>
<li>Hono appをexport</li>
<li><code>wrangler deploy</code>で公開</li>
<li>公開までの距離を短くする</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" lang="en-US" data-marpit-pagination="36" style="--paginate:true;" data-marpit-pagination-total="46" data-size="16:9">
<h2 id="%E3%83%87%E3%83%BC%E3%82%BF%E3%81%8C%E5%BF%85%E8%A6%81%E3%81%AA%E3%82%89d1%E3%81%AB%E3%81%A4%E3%81%AA%E3%81%90">データが必要ならD1につなぐ</h2>

  <div class="flow-arrow">→</div>
  <div class="flow-step"><b>DATA</b><span>D1 binding</span></div>
  <div class="flow-arrow">→</div>
  <div class="flow-step"><b>RESPONSE</b><span>HTML / JSON</span></div>
</div>
<div class="note">Renovel本体はBun + PostgreSQLです。Workers + D1は持ち帰り用の別サンプルです。</div>
<ul>
<li>Renovel本体: Bun + PostgreSQL</li>
<li>ここで紹介する構成: Workers + D1</li>
<li>別の選択肢として考える</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" lang="en-US" data-marpit-pagination="37" style="--paginate:true;" data-marpit-pagination-total="46" data-size="16:9">

<div class="flow">
  <div class="flow-step"><b>Next.js</b><span>Vercel / AWS など</span></div>
  <div class="flow-arrow">→</div>
  <div class="flow-step"><b>Hono</b><span>Cloudflare Workers</span></div>
</div>
<div class="big-statement">小さく始めて、<br /><em>収益化の余地</em>も残す</div>
<div class="note">Vercel Hobbyは商用利用に制限があります。Cloudflare Workersには無料枠があります。プランと利用条件は公開前に確認します。</div>
<ul>
<li>料金だけで決めない</li>
<li>商用利用の条件を確認する</li>
<li>無料枠・制限は公開前に確認する</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" lang="en-US" data-marpit-pagination="38" style="--paginate:true;" data-marpit-pagination-total="46" data-size="16:9">

  <div class="flow-arrow">→</div>
  <div class="flow-step"><b>EDGE</b><span>世界のエッジで動かす</span></div>
  <div class="flow-arrow">→</div>
  <div class="flow-step"><b>PAID</b><span>必要になったら払う</span></div>
</div>
<div class="big-statement">だからHonoは<br /><em>Cloudflareと相性がいい</em></div>
<ul>
<li>Web標準に近い</li>
<li>小さく公開しやすい</li>
<li>必要になったら構成を広げる</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" lang="en-US" data-marpit-pagination="39" style="--paginate:true;" data-marpit-pagination-total="46" data-size="16:9">

<ul>
<li>
<p><strong>Next.js</strong><br />
Reactの大きなエコシステム、RSC、Server Actions、画像最適化を使いたいとき</p>
</li>
<li>
<p><strong>TanStack Start</strong><br />
型付きroute tree、loader、client navigation、Server Functionsが欲しいとき</p>
</li>
<li>
<p><strong>Hono</strong><br />
SSR中心で、局所的な操作とWeb標準に近い実装をしたいとき</p>
</li>
</ul>
<p>今の自分に必要なものを選びます。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" lang="en-US" data-marpit-pagination="40" style="--paginate:true;" data-marpit-pagination-total="46" data-size="16:9">

<div class="panel">
<h3 id="%E5%90%88%E3%81%84%E3%82%84%E3%81%99%E3%81%84">合いやすい</h3>
<ul>
<li>CRUDが中心で画面の動きは局所的</li>
<li>APIとSSRを同じ言語・同じアプリで書きたい</li>
<li>Reactの巨大なエコシステムは必須ではない</li>
<li>運用コストと認知負荷を抑えたい</li>
</ul>
</div>
<div class="type-ghost stats-word">Renovelでの判断</div>
