name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      # デッキも dist/slides/ にビルドされるので、スライド本体とテーマの変更でもデプロイする
      - "slides/**"
      - ".marp/**"
      - ".github/workflows/deploy.yaml"
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    strategy:
      # 片方が落ちてももう片方は出す。
      fail-fast: false
      matrix:
        # Pages のプロジェクト名は各アプリの wrangler.jsonc が持っている。
        app: [slides, articles]
    steps:
      # 日付は slide.md が git に入った日から引くので、全履歴が要る。
      # 浅いクローンだと全デッキが同じ日付になってしまう。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ビルドスクリプトを node が直接実行するので 24 を明示しておく。
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      # ワークスペースなので install はルートで。
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static site
        working-directory: apps/${{ matrix.app }}
        run: bun run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/${{ matrix.app }}
          packageManager: bun
          command: pages deploy
