name: Deploy frontend to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      # デッキも dist/slides/ にビルドされるので、スライド本体とテーマの変更でもデプロイする
      - "slides/**"
      - ".marp/**"
      - ".github/workflows/deploy.yaml"
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      # 日付は slide.md が git に入った日から引くので、全履歴が要る。
      # 浅いクローンだと全デッキが同じ日付になってしまう。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # scripts/prerender.ts is run directly by node, which needs >= 22.18
      # for type stripping.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      # tsc -> client build -> SSR build -> prerender into frontend/dist
      - name: Build static site
        working-directory: frontend
        run: bun run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          packageManager: bun
          command: pages deploy
