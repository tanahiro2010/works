name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "slides/**"
      - ".marp/**"
      - ".github/workflows/deploy.yaml"
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    strategy:
      # 片方が落ちてももう片方は出す。
      fail-fast: false
      matrix:
        # Pages のプロジェクト名は各アプリの wrangler.jsonc が持っている。
        app: [slides, articles]
    steps:
      # 日付は slide.md が git に入った日から引くので、全履歴が要る。
      # 浅いクローンだと全デッキが同じ日付になってしまう。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # このアプリの入力が変わっていなければ、ビルドもデプロイも飛ばす。
      # 記事だけ直したときに slides を作り直しても出来上がりは同じなので。
      - name: Check for changes
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # 手動実行・初回push・force push の後は判断材料が無いので必ず作る。
          if [ "${{ github.event_name }}" != "push" ] \
            || [ -z "$BEFORE" ] \
            || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "差分を判定できないのでビルドします"
            exit 0
          fi

          files=$(git diff --name-only "$BEFORE" "${{ github.sha }}")

          # 自分のアプリ・共有パッケージ・ワークフローは常に対象。
          # 記事側が slide.md も見ているのは、slug と date をデッキから
          # 継承しているため。slide.md だけ直して articles を飛ばすと
          # 記事の URL が古いままになる。
          # 画像などの素材は両方が参照しうるので両方の対象に入れる。
          case "${{ matrix.app }}" in
            slides)   own='^apps/slides/|^packages/|^\.marp/|^\.github/workflows/|^slides/.*/slide\.md$' ;;
            articles) own='^apps/articles/|^packages/|^\.github/workflows/|^slides/.*/(article|slide)\.md$' ;;
          esac
          shared='^slides/[^/]+/[^/]+/(img|images|assets)/'

          if echo "$files" | grep -qE "$own|$shared"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.app }}: 対象の変更あり"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.app }}: 対象の変更なし。ビルドとデプロイを飛ばします"
          fi

      # ビルドスクリプトを node が直接実行するので 24 を明示しておく。
      - uses: actions/setup-node@v7
        if: steps.changed.outputs.run == 'true'
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2
        if: steps.changed.outputs.run == 'true'
        with:
          bun-version: "1.4.3"

      # ワークスペースなので install はルートで。
      - name: Install dependencies
        if: steps.changed.outputs.run == 'true'
        run: bun install --frozen-lockfile

      - name: Build static site
        if: steps.changed.outputs.run == 'true'
        working-directory: apps/${{ matrix.app }}
        run: bun run build

      - name: Deploy to Cloudflare Pages
        if: steps.changed.outputs.run == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/${{ matrix.app }}
          packageManager: bun
          command: pages deploy
